    <script>
      (function() {
        // 1. Intercept console.error to suppress Vite HMR WebSocket disconnect messages in dev preview
        if (typeof window !== 'undefined' && window.console && window.console.error) {
          var origError = window.console.error;
          window.console.error = function() {
            var msg = '';
            for (var i = 0; i < arguments.length; i++) {
              msg += ' ' + String(arguments[i] && (arguments[i].message || arguments[i].stack || arguments[i]) || '');
            }
            if (
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('failed to connect to websocket') !== -1 ||
              msg.indexOf('vite:ws:disconnect') !== -1
            ) {
              return;
            }
            return origError.apply(window.console, arguments);
          };
        }

        // 2. Mock WebSocket for 'vite-hmr' protocol so @vite/client never rejects with 'WebSocket closed without opened'
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = 
              protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 && url.indexOf('vite') !== -1));

            if (isViteHmr) {
              var stub = new EventTarget();
              stub.readyState = 1; // WebSocket.OPEN
              stub.url = url;
              stub.protocol = 'vite-hmr';
              stub.bufferedAmount = 0;
              stub.extensions = '';
              stub.binaryType = 'blob';
              stub.send = function() {};
              stub.close = function() {
                stub.readyState = 3; // CLOSED
                if (typeof stub.onclose === 'function') stub.onclose(new CloseEvent('close', { wasClean: true }));
                stub.dispatchEvent(new CloseEvent('close', { wasClean: true }));
              };
              setTimeout(function() {
                stub.readyState = 1; // OPEN
                if (typeof stub.onopen === 'function') stub.onopen(new Event('open'));
                stub.dispatchEvent(new Event('open'));
              }, 10);
              return stub;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 3. Catch window error & unhandledrejection in capture phase
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event.reason && (event.reason.message || event.reason) || '');
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = String(event.message || (event.error && event.error.message) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

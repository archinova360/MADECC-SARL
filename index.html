    <script>
      (function() {
        // 1. Intercept console.error to suppress Vite HMR WebSocket disconnect messages in dev preview
        if (typeof window !== 'undefined' && window.console && window.console.error) {
          var origError = window.console.error;
          window.console.error = function() {
            var msg = '';
            for (var i = 0; i < arguments.length; i++) {
              msg += ' ' + String(arguments[i] && (arguments[i].message || arguments[i].stack || arguments[i]) || '');
            }
            if (
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('failed to connect to websocket') !== -1 ||
              msg.indexOf('vite:ws:disconnect') !== -1
            ) {
              return;
            }
            return origError.apply(window.console, arguments);
          };
        }

        // 2. Mock WebSocket for 'vite-hmr' protocol so @vite/client never rejects with 'WebSocket closed without opened'
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = 
              protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 && url.indexOf('vite') !== -1));

            if (isViteHmr) {
              var stub = new EventTarget();
              stub.readyState = 1; // WebSocket.OPEN
              stub.url = url;
              stub.protocol = 'vite-hmr';
              stub.bufferedAmount = 0;
              stub.extensions = '';
              stub.binaryType = 'blob';
              stub.send = function() {};
              stub.close = function() {
                stub.readyState = 3; // CLOSED
                if (typeof stub.onclose === 'function') stub.onclose(new CloseEvent('close', { wasClean: true }));
                stub.dispatchEvent(new CloseEvent('close', { wasClean: true }));
              };
              setTimeout(function() {
                stub.readyState = 1; // OPEN
                if (typeof stub.onopen === 'function') stub.onopen(new Event('open'));
                stub.dispatchEvent(new Event('open'));
              }, 10);
              return stub;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 3. Catch window error & unhandledrejection in capture phase (suppresses harmless AbortError, media interruptions & WebSocket disconnects)
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event.reason && (event.reason.message || event.reason.name || event.reason) || '');
          var isAbort = (
            (event.reason && (event.reason.name === 'AbortError' || event.reason.code === 20)) ||
            reason.indexOf('AbortError') !== -1 ||
            reason.indexOf('aborted') !== -1 ||
            reason.indexOf('The user aborted a request') !== -1 ||
            reason.indexOf('interrupted by a call to pause') !== -1
          );
          if (isAbort || reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = String(event.message || (event.error && (event.error.message || event.error.name)) || '');
          var isAbort = (
            (event.error && (event.error.name === 'AbortError' || event.error.code === 20)) ||
            msg.indexOf('AbortError') !== -1 ||
            msg.indexOf('aborted') !== -1 ||
            msg.indexOf('The user aborted a request') !== -1 ||
            msg.indexOf('interrupted by a call to pause') !== -1
          );
          if (isAbort || msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <!-- Google AdSense Account Config & Performance-Optimized Idle Loading (Eliminates main-thread blocking during initial paint) -->
    <meta name="google-adsense-account" content="ca-pub-7227721489757915" />
    <script>
      (function() {
        var adsLoaded = false;
        function loadAdSense() {
          if (adsLoaded) return;
          adsLoaded = true;
          window.removeEventListener('scroll', loadAdSense);
          window.removeEventListener('pointerdown', loadAdSense);
          window.removeEventListener('touchstart', loadAdSense);
          window.removeEventListener('keydown', loadAdSense);
          var s = document.createElement('script');
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7227721489757915';
          s.crossOrigin = 'anonymous';
          s.async = true;
          document.head.appendChild(s);
        }
        window.addEventListener('scroll', loadAdSense, { passive: true, once: true });
        window.addEventListener('pointerdown', loadAdSense, { passive: true, once: true });
        window.addEventListener('touchstart', loadAdSense, { passive: true, once: true });
        window.addEventListener('keydown', loadAdSense, { passive: true, once: true });
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadAdSense, { timeout: 8500 });
          } else {
            setTimeout(loadAdSense, 8500);
          }
        }, { once: true });
      })();
    </script>
